<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contador interactivo de clics para demostrar el manejo de eventos en JavaScript.">
    <title>Contador Interactivo | Portafolio JS</title>
    <style>
        /* Estilos rápidos para simular una interfaz de aplicación real */
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; padding: 50px; }
        .caja-contador { background-color: #1e293b; max-width: 300px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #visor-numero { font-size: 48pt; font-weight: bold; margin: 20px 0; color: #38bdf8; }
        .btn { padding: 10px 20px; font-size: 12pt; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin: 5px; transition: background 0.2s; }
        .btn-incrementar { background-color: #10b981; color: white; }
        .btn-incrementar:hover { background-color: #059669; }
        .btn-resetear { background-color: #ef4444; color: white; }
        .btn-resetear:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <main>
        <h1>Manejo de Eventos del DOM</h1>
        <p>Haz clic en los botones para alterar el estado de la memoria en tiempo real:</p>
        
        <article class="caja-contador">
            <h3>Contador de Tareas</h3>
            <!-- El número que JavaScript modificará -->
            <div id="visor-numero">0</div>
            
            <button id="btn-sumar" class="btn btn-incrementar">Incrementar</button>
            <button id="btn-limpiar" class="btn btn-resetear">Resetear</button>
        </article>
    </main>

    <!-- Conexión con el archivo de eventos -->
    <script src="contador.js"></script>
</body>
</html>
